<form id="parent">
    <input type="text" name="a.c" value="1" />
    <input type="text" name="a.b.d" value="2" />
    <input type="text" name="a.b.e" value="3" />
  </form>
  
<script>
    function aggregateValues(id) {
      const elemId = document.getElementById(id);
      const formData = new FormData(elemId);
      let values = Object.fromEntries(formData.entries());
      console.log(values);
      let result = {};
      for (let [key, value] of Object.entries(values)) {
        let keys = key.split('.');
        let node = result;
        for (let i = 0; i < keys.length - 1; i++) {
          if (!node[keys[i]]) {
            node[keys[i]] = {};
          }
          node = node[keys[i]];
        }
        node[keys[keys.length - 1]] = value;
      }
      return JSON.stringify(result);
    }
    console.log(aggregateValues('parent'));

    //Output:
    // {
    //   "a": {
    //     "c": "1",
    //     "b": {
    //       "d": "2",
    //       "e": "3"
    //     }
    //   }
    // }
  </script>
