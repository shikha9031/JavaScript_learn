<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" type="text/css" href="styles.css" />
  <style>
    #root {
      display: flex;
      gap: 8px;
    }

    #root>div {
      border: 1px solid;
      width: 50px;
      height: 50px;
    }

    .alpha {
      padding: 10px 10px;
      background-color: red;
      border-style: dotted !important;
    }

    .beta {
      padding-top: 10px;
      padding-bottom: 10px;
      padding-right: 10px;
      padding-left: 10px;
      background-color: #000;
    }

    .gamma {
      padding: 10px 0 0;
      background-color: rgb(255, 0, 0);
    }
  </style>
</head>

<body>
  <div id="root">
    <div class="alpha"></div>
    <div class="beta"></div>
    <div class="gamma"></div>
  </div>

  <script>

    const elem = document.getElementById('root');
    console.log(getElementsByStyle(elem, 'paddingTop', '10px'));
    export default function getElementsByStyle(element, property, value) {
      let result = [];
      let queue = [...element.children];
      while (queue.length > 0) {
        let curr = queue.shift();
        if (!curr && !curr.children.length <= 0) {
          continue;
        }
        let styleObj = window.getComputedStyle(curr);
        let val = styleObj.getPropertyValue(property);
        if (val === value) {
          result.push(curr);
        }
        if (curr && curr.children.length > 0) {
          queue.push(...curr.children);
        }
      }
      return result;
    }
  </script>
</body>

</html>
